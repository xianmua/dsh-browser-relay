<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>页面 AI 助手 - 设置</title>
    <style>
      body {
        font-family: "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
        font-size: 13px;
        color: #333;
        width: 680px;
        margin: 32px auto;
      }
      h2 {
        font-size: 16px;
        margin-bottom: 20px;
      }
      .field {
        margin-bottom: 14px;
      }
      label {
        display: block;
        margin-bottom: 4px;
        color: #666;
      }
      input,
      select,
      textarea {
        width: 100%;
        box-sizing: border-box;
        border: 1px solid #ccc;
        border-radius: 4px;
        padding: 6px 8px;
        font-size: 13px;
        outline: none;
        background: #fff;
      }
      input:focus,
      select:focus,
      textarea:focus {
        border-color: #1a1a1a;
      }
      textarea {
        height: 170px;
        resize: vertical;
        font-family: inherit;
        line-height: 1.7;
      }
      .btn-row {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 12px;
        margin-top: 20px;
      }
      button {
        border: 1px solid #1a1a1a;
        background: #1a1a1a;
        color: #fff;
        border-radius: 4px;
        padding: 6px 20px;
        cursor: pointer;
        font-size: 13px;
      }
      button:hover {
        background: #333;
      }
    </style>
  </head>
  <body>
    <h2>页面 AI 助手 - 设置</h2>
    <div class="field">
      <label for="baseURLOverride"
        >Relay 地址（可选，留空用扩展内置地址；切换远程机器填 http://主机:端口）</label
      >
      <input id="baseURLOverride" placeholder="" />
    </div>
    <div class="field">
      <label for="tokenOverride"
        >Relay Token（可选，留空用扩展内置口令；连远程机器且口令不一致时才需要填）</label
      >
      <input id="tokenOverride" placeholder="" autocomplete="off" />
    </div>
    <div class="field">
      <label for="workspace"
        >工作区（可选，填 DSH 工作区目录绝对路径；任务会话将归组到该工作区，留空不分组）</label
      >
      <input id="workspace" placeholder="/绝对路径/到/工作区" />
    </div>
    <div class="field">
      <label for="aiLevel"
        >智能等级（L4 默认；L2 本页面读写禁导航，L3 可同域含子域导航，L5 开放 DSH 全量+浏览器全量）</label
      >
      <select id="aiLevel">
        <option value="none">L1：仅问答（不触碰页面）</option>
        <option value="page">L2：本页面读写（禁导航）</option>
        <option value="site">L3：站内浏览（同域含子域可导航）</option>
        <option value="dsh">L4：页面+DSH 工具（默认）</option>
        <option value="all">L5：DSH 全量+浏览器全量</option>
      </select>
    </div>
    <div class="field">
      <label for="showFx">特效（与智能等级解绑，L1 下不生效）</label>
      <select id="showFx" style="width: auto">
        <option value="">关闭（静默执行）</option>
        <option value="1">模拟光标 + 操作特效</option>
      </select>
    </div>
    <div class="field">
      <label for="customPrompt">自定义指令（可选，随任务发给 AI 的行为要求，每行一条）</label>
      <textarea
        id="customPrompt"
        placeholder="例如：&#10;填写日期一律用今天往前推一天的日期&#10;表格里只操作前 10 行"
      ></textarea>
    </div>
    <div class="btn-row">
      <button id="save">保存</button>
      <span id="tip"></span>
    </div>
    <p id="ver" style="color: #bbb; font-size: 12px; margin-top: 24px; text-align: center"></p>
    <script src="config.js"></script>
    <script src="options.js"></script>
  </body>
</html>
